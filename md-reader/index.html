    /* The switch - the box around the slider */
    .theme-switch-wrapper {
      display: flex;
      align-items: center;
    }

    em {
      margin-left: 10px;
      font-size: 1rem;
      margin-right: 15px;
      color: #666;
    }
    body.dark-mode em {
      color: #aaa;
    }

    .theme-switch {
      position: relative;
      display: inline-block;
      width: 36px;
      height: 16px;
    }

    /* Hide default HTML checkbox */
    .theme-switch input {
      opacity: 0;
      width: 0;
      height: 0;
    }

    /* The slider */
    .slider {
      position: absolute;
      cursor: pointer;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background-color: #ccc;
      -webkit-transition: .4s;
      transition: .4s;
    }

    .slider:before {
      position: absolute;
      content: "";
      height: 12px;
      width: 12px;
      left: -1px;
      bottom: 2px;
      background-color: white;
      -webkit-transition: .4s;
      transition: .4s;
    }

    input:checked + .slider {
      background-color: #2196F3;
    }

    input:focus + .slider {
      box-shadow: 0 0 1px #2196F3;
    }

    input:checked + .slider:before {
      -webkit-transform: translateX(22px);
      -ms-transform: translateX(22px);
      transform: translateX(22px);
    }

    /* Rounded sliders */
    .slider.round {
      border-radius: 24px; /* Slimmer */
    }

    .slider.round:before {
      border-radius: 50%;
    }
  </style>

<body>
  <div id="dropzone">
    <span>Drop an <code>.md</code> file here</span>
    <label for="file-upload" class="browse-btn">Browse</label>
    <span class="dz-hint">or write / paste your markdown in the editor below</span>
    <input type="file" id="file-upload" accept=".md,.markdown,.txt" style="display: none;">
  </div>

  <textarea id="markdown-input" spellcheck="true"
    placeholder="Write or paste your markdown here...&#10;&#10;Tip: Ctrl+S saves your text (Shift+Ctrl+S always opens the save dialog), Ctrl+Enter renders it."></textarea>

  <div class="action-bar">
    <div class="button-group">
      <button id="save-btn" title="Save the text to a file on your computer or a synced cloud folder (Ctrl+S). Shift-click to always pick a new location.">Save</button>
      <button id="render-btn" title="Open the rendered markdown in a new tab (Ctrl+Enter)">Render</button>
    </div>
    <span id="status" role="status" aria-live="polite"></span>
    <div class="toolbar-right">
      <span id="counter" class="counter"></span>
      <div class="theme-switch-wrapper">
        <em>light / dark </em>
        <label class="theme-switch" for="checkbox">
          <input type="checkbox" id="checkbox" />
          <div class="slider round"></div>
        </label>
      </div>
    </div>
  </div>
  <script src="marked.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
